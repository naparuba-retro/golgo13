name: build

# The recompiled game code (generated/) is derived from the ROMs and is never published, so CI builds the program WITHOUT game code:
# it checks that everything compiles on Windows and Linux, renders the menu pages (smoke test) and publishes the binaries.
# To play, build locally with your own ROMs (see README, "Construire").

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GOLGO13_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  windows:
    runs-on: windows-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - name: "Menu fonts (baked on Linux from the free DejaVu font)"
        uses: actions/download-artifact@v4
        with:
          name: menu-fonts
          path: data/ui
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python venv (tools run inside .venv)
        shell: bash
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE\.venv\Scripts" >> "$GITHUB_PATH"
          .venv/Scripts/python -m pip install pillow numpy
      - name: Third-party (SDL3, minimp3)
        run: |
          python tools/setup_sdl3.py
          python tools/setup_deps.py
      - name: Build (MSVC)
        run: python tools/build/build.py
      - name: Menu smoke test (renders every menu page without a window)
        run: build\golgo13.exe --menu-shots menu-shots --lang fr
      - name: "Bundle (program + project files + free menu font)"
        uses: actions/upload-artifact@v4
        with:
          name: golgo13-windows-x64
          path: |
            .
            !.git/**
            !.venv/**
            !build/obj/**
            !menu-shots/**
      - uses: actions/upload-artifact@v4
        with:
          name: menu-shots
          path: menu-shots/*.ppm

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: System packages (SDL3 is built from source below)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev \
            libudev-dev libdbus-1-dev libxtst-dev libxkbcommon-x11-dev fonts-dejavu-core
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install pillow numpy
      - name: Third-party (minimp3)
        run: python tools/setup_deps.py
      - name: Menu fonts
        run: python tools/ui/bake_font.py
      - name: "Share the baked free fonts with the Windows job"
        uses: actions/upload-artifact@v4
        with:
          name: menu-fonts
          path: data/ui/*.bin
      - name: Build (CMake, SDL3 fetched)
        run: |
          cmake -S . -B build-linux -G Ninja -DGOLGO_FETCH_SDL3=ON -DSDL_X11_XTEST=OFF -DSDL_VULKAN=OFF -DSDL_TESTS=OFF
          cmake --build build-linux
      - name: Menu smoke test
        run: ./build-linux/golgo13 --menu-shots menu-shots --lang fr
      - name: "Bundle (program + project files + free menu font)"
        uses: actions/upload-artifact@v4
        with:
          name: golgo13-linux-x64
          path: |
            .
            !.git/**
            !.venv/**
            !build-linux/**
            !menu-shots/**
            build-linux/golgo13

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: golgo13-windows-x64, path: golgo13-windows-x64 }
      - uses: actions/download-artifact@v4
        with: { name: golgo13-linux-x64, path: golgo13-linux-x64 }
      - name: "Zip the bundles"
        run: |
          chmod +x golgo13-linux-x64/build-linux/golgo13 || true
          (cd golgo13-windows-x64 && zip -qr ../golgo13-${GOLGO13_VERSION}-windows-x64.zip .)
          tar -czf golgo13-${GOLGO13_VERSION}-linux-x64.tar.gz -C golgo13-linux-x64 .
      - name: "Create the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Native port of the Golgo 13 arcade games (Namco System 12 / System 10).

          **No ROM and no game code is included.** Extract the bundle, put your own ROMs in `roms/` (golgo13.zip, g13knd.zip, g13jnr.zip),
          then run the program (`build\golgo13.exe` on Windows): choose a game and the in-app build screen generates the game code from
          *your* ROMs and compiles it (needs Python 3.10+ and a C compiler: Visual Studio Build Tools on Windows, gcc + CMake on Linux).
          Or run `python tools/setup.py`. See the README for details.
          NOTES
          gh release create "$GOLGO13_VERSION" golgo13-${GOLGO13_VERSION}-windows-x64.zip golgo13-${GOLGO13_VERSION}-linux-x64.tar.gz             --repo "$GITHUB_REPOSITORY" --title "Golgo 13 native port $GOLGO13_VERSION" --notes-file notes.md
